<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧍 STRICHMÄNNCHEN · 9 RESPOS · TANZ · FILM</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background: #0a0a0f;
  color: #c8d0d0;
  font-family: 'Consolas', 'Courier New', monospace;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  background: radial-gradient(ellipse at 50% 50%, #0a0a1a, #000000);
}
.container {
  max-width: 900px;
  width: 100%;
  background: rgba(10,10,20,0.3);
  border: 1px solid rgba(0,204,255,0.05);
  border-radius: 20px;
  padding: 24px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 100px rgba(0,0,0,0.8);
}
.header {
  text-align: center;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.02);
  margin-bottom: 16px;
}
.header h1 {
  font-size: 24px;
  background: linear-gradient(90deg, #00ccff, #ff66ff, #ffaa00, #00ff88);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 4px;
}
.header .sub {
  color: #445555;
  font-size: 11px;
  letter-spacing: 3px;
}
.header .sub .stick { color: #00ff88; }
.header .sub .respo { color: #ff66ff; }

.canvas-wrap {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  aspect-ratio: 1/1;
  background: rgba(0,0,0,0.4);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.02);
  overflow: hidden;
}
#stickCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}
@media (max-width:600px){ .info-grid { grid-template-columns:1fr 1fr; } }

.info-card {
  background: rgba(10,10,20,0.2);
  border: 1px solid rgba(255,255,255,0.02);
  border-radius: 8px;
  padding: 8px 6px;
  text-align: center;
  font-size: 9px;
}
.info-card .value {
  font-size: 18px;
  font-weight: bold;
  font-family: monospace;
}
.info-card .label {
  color: #445555;
  font-size: 7px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 2px;
}

.controls {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 12px;
}
.controls button {
  background: rgba(20,35,35,0.2);
  color: #668888;
  border: 1px solid rgba(255,255,255,0.02);
  padding: 5px 16px;
  border-radius: 18px;
  cursor: pointer;
  font-family: inherit;
  font-size: 9px;
  transition: all 0.3s;
}
.controls button:hover { background: rgba(40,80,70,0.08); color: #aaeedd; }
.controls button.active { background: rgba(40,80,70,0.06); color: #00ff88; }
.controls button.stick { color: #00ff88; border-color: rgba(0,255,136,0.05); }
.controls button.respo { color: #ff66ff; border-color: rgba(255,102,255,0.05); }

.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 6px 12px;
  margin-top: 10px;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
  font-size: 8px;
  color: #445555;
  border: 1px solid rgba(255,255,255,0.01);
}

.footer {
  text-align: center;
  margin-top: 10px;
  color: #222;
  font-size: 8px;
  letter-spacing: 2px;
}
.footer span { color: #ff66ff; }
</style>
</head>
<body>

<div class="container">

<div class="header">
  <h1>🧍 STRICHMÄNNCHEN · 9 RESPOS</h1>
  <div class="sub"><span class="stick">TANZ · FILM</span> · <span class="respo">NONSTOP · 1/2 SEK</span></div>
</div>

<div class="canvas-wrap">
  <canvas id="stickCanvas"></canvas>
</div>

<div class="info-grid">
  <div class="info-card">
    <div class="value" id="frameCount" style="color:#00ff88;">0</div>
    <div class="label">FRAME</div>
  </div>
  <div class="info-card">
    <div class="value" id="respoCount" style="color:#ff66ff;">0</div>
    <div class="label">RESPOS</div>
  </div>
  <div class="info-card">
    <div class="value" id="fpsDisplay" style="color:#ffaa00;">0</div>
    <div class="label">FPS</div>
  </div>
  <div class="info-card">
    <div class="value" id="loopDisplay" style="color:#00ccff;">0</div>
    <div class="label">LOOP</div>
  </div>
</div>

<div class="controls">
  <button class="active stick" id="btnStart">▶ START</button>
  <button class="respo" id="btnRespo">🔄 RESPO</button>
  <button class="stick" id="btnShuffle">🔀 SHUFFLE</button>
  <button id="btnProof">🔮 PROOF</button>
  <button id="btnReset">⟲ RESET</button>
</div>

<div class="status-bar">
  <span>🧍 STATUS: <span id="statusText">läuft</span></span>
  <span>🎯 FRAME: <span id="frameStatus">0</span></span>
  <span>⏱️ <span id="timeStatus">00:00</span></span>
</div>

<div class="footer">
  <span>🧍</span> STRICHMÄNNCHEN · 9 RESPOS · TANZ · <span>wieimmer4u</span>
</div>

</div>

<script>
// ============================================================
// STRICHMÄNNCHEN · 9 RESPOS · TANZ · FILM
// ============================================================

// ===== CANVAS =====
const canvas = document.getElementById('stickCanvas');
const ctx = canvas.getContext('2d');
let running = true;
let time = 0;
let frame = 0;
let totalRespos = 0;
let loopCount = 0;
let fps = 0;
let frameCount = 0;
let fpsTime = 0;

// ===== 9 FRAMES (RESPOS) =====
// Jeder Frame = 9 RESPOS mit minimalen Änderungen
const FRAMES = [
  // Frame 0: Stehen
  { head: 0, armL: -30, armR: 30, legL: -10, legR: 10, body: 0, tilt: 0 },
  // Frame 1: Arm leicht gehoben
  { head: 2, armL: -20, armR: 45, legL: -15, legR: 15, body: 1, tilt: 2 },
  // Frame 2: Schritt vorne
  { head: 4, armL: -10, armR: 60, legL: -25, legR: 25, body: 2, tilt: 4 },
  // Frame 3: Schwung
  { head: 6, armL: 0, armR: 75, legL: -20, legR: 30, body: 3, tilt: 6 },
  // Frame 4: Kopf geneigt
  { head: 8, armL: 10, armR: 70, legL: -10, legR: 35, body: 4, tilt: 8 },
  // Frame 5: Zurück
  { head: 6, armL: 20, armR: 60, legL: 0, legR: 30, body: 3, tilt: 6 },
  // Frame 6: Bein zurück
  { head: 4, armL: 30, armR: 45, legL: 10, legR: 20, body: 2, tilt: 4 },
  // Frame 7: Übergang
  { head: 2, armL: 20, armR: 30, legL: 5, legR: 15, body: 1, tilt: 2 },
  // Frame 8: Rückkehr
  { head: 0, armL: 0, armR: 0, legL: 0, legR: 0, body: 0, tilt: 0 }
];

// ===== 9 RESPOS PRO FRAME =====
// Jeder Frame wird in 9 kleine Schritte zerlegt
function getRespoFrame(frameIndex, respoIndex) {
  const base = FRAMES[frameIndex % FRAMES.length];
  const next = FRAMES[(frameIndex + 1) % FRAMES.length];
  const t = respoIndex / 9; // 0.0 bis 0.888

  // Interpolation zwischen base und next
  const lerp = (a, b, t) => a + (b - a) * t;

  return {
    head: lerp(base.head, next.head, t),
    armL: lerp(base.armL, next.armL, t),
    armR: lerp(base.armR, next.armR, t),
    legL: lerp(base.legL, next.legL, t),
    legR: lerp(base.legR, next.legR, t),
    body: lerp(base.body, next.body, t),
    tilt: lerp(base.tilt, next.tilt, t),
    progress: t
  };
}

// ===== ZEICHNEN =====
function drawStickman(data, w, h) {
  const cx = w/2;
  const cy = h/2;
  const scale = Math.min(w, h) * 0.15;
  const tilt = data.tilt * 0.02;

  ctx.clearRect(0, 0, w, h);

  // Hintergrund (Karo-Papier)
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < w; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  }
  for (let y = 0; y < h; y += 30) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }

  // Dreieck (Karo-Papier)
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(cx - scale * 2, cy + scale * 1.5);
  ctx.lineTo(cx, cy - scale * 2);
  ctx.lineTo(cx + scale * 2, cy + scale * 1.5);
  ctx.closePath();
  ctx.stroke();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);

  const s = scale;

  // Kopf
  ctx.shadowColor = '#00ff8844';
  ctx.shadowBlur = 15;
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, -s * 1.2 + data.head * 0.03 * s, s * 0.25, 0, Math.PI * 2);
  ctx.stroke();

  // Körper
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.9 + data.body * 0.02 * s);
  ctx.lineTo(0, s * 0.2 + data.body * 0.02 * s);
  ctx.stroke();

  // Arme
  ctx.shadowBlur = 10;
  ctx.lineWidth = 2;
  // Linker Arm
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.7 + data.body * 0.02 * s);
  ctx.lineTo(-s * 0.6 + data.armL * 0.008 * s, -s * 0.3 + data.body * 0.02 * s);
  ctx.stroke();
  // Rechter Arm
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.7 + data.body * 0.02 * s);
  ctx.lineTo(s * 0.6 + data.armR * 0.008 * s, -s * 0.3 + data.body * 0.02 * s);
  ctx.stroke();

  // Beine
  ctx.shadowBlur = 8;
  ctx.lineWidth = 2;
  // Linkes Bein
  ctx.beginPath();
  ctx.moveTo(0, s * 0.2 + data.body * 0.02 * s);
  ctx.lineTo(-s * 0.3 + data.legL * 0.01 * s, s * 0.7 + data.legL * 0.01 * s);
  ctx.stroke();
  // Rechtes Bein
  ctx.beginPath();
  ctx.moveTo(0, s * 0.2 + data.body * 0.02 * s);
  ctx.lineTo(s * 0.3 + data.legR * 0.01 * s, s * 0.7 + data.legR * 0.01 * s);
  ctx.stroke();

  ctx.restore();

  // Frame Info
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#445555';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`Frame ${frame} · RESPO ${totalRespos % 9 + 1}/9`, 10, h - 10);

  // Fortschrittsbalken
  const progress = data.progress || 0;
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  ctx.fillRect(10, h - 20, 100, 4);
  ctx.fillStyle = '#00ff8844';
  ctx.fillRect(10, h - 20, progress * 100, 4);
}

// ===== UPDATE =====
function update() {
  // 9 RESPOS pro Frame, 1/2 Sekunde pro Frame
  // Jede 1/2 Sekunde → nächster Frame
  const frameDuration = 500; // ms
  const respoDuration = frameDuration / 9; // ~55ms pro RESPO

  const now = Date.now();
  const elapsed = now - (fpsTime || now);

  if (elapsed > respoDuration) {
    totalRespos++;
    frame = Math.floor(totalRespos / 9) % FRAMES.length;
    loopCount = Math.floor(totalRespos / (FRAMES.length * 9));
    fpsTime = now;

    // FPS berechnen
    frameCount++;
    if (now - fpsTime > 1000) {
      fps = frameCount;
      frameCount = 0;
      fpsTime = now;
    }

    updateUI();
  }

  const respoIndex = totalRespos % 9;
  const data = getRespoFrame(frame, respoIndex);
  const w = canvas.width, h = canvas.height;
  drawStickman(data, w, h);

  requestAnimationFrame(update);
}

// ===== UI UPDATE =====
function updateUI() {
  document.getElementById('frameCount').textContent = frame;
  document.getElementById('respoCount').textContent = totalRespos % 9 + 1;
  document.getElementById('fpsDisplay').textContent = fps;
  document.getElementById('loopDisplay').textContent = loopCount;
  document.getElementById('frameStatus').textContent = frame;
  document.getElementById('statusText').textContent = totalRespos > 0 ? 'tanzend' : 'läuft';
}

// ===== RESPO MANUAL =====
function triggerRespo() {
  totalRespos++;
  frame = Math.floor(totalRespos / 9) % FRAMES.length;
  loopCount = Math.floor(totalRespos / (FRAMES.length * 9));
  updateUI();
  console.log(`🔄 RESPO ${totalRespos % 9 + 1}/9 · Frame ${frame}`);
}

// ===== SHUFFLE =====
function shuffleRespos() {
  // Vertausche RESPO-Reihenfolge zufällig
  for (let i = 0; i < 9; i++) {
    const idx1 = Math.floor(Math.random() * 9);
    const idx2 = Math.floor(Math.random() * 9);
    const temp = FRAMES[idx1];
    FRAMES[idx1] = FRAMES[idx2];
    FRAMES[idx2] = temp;
  }
  console.log('🔀 SHUFFLE · RESPOS neu gemischt');
}

// ===== PROOF =====
function showProof() {
  const proof = document.createElement('div');
  proof.style.cssText = `
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; justify-content: center; align-items: center;
    z-index: 9999; backdrop-filter: blur(20px);
    font-family: 'Consolas', monospace;
  `;
  proof.innerHTML = `
    <div style="text-align:center; padding:40px; border:1px solid rgba(0,255,136,0.1); border-radius:20px; background:rgba(10,10,20,0.6); max-width:450px;">
      <div style="font-size:48px; color:#00ff88;">🧍</div>
      <div style="color:#00ff88; font-size:20px; margin:12px 0; letter-spacing:4px;">STRICHMÄNNCHEN · 9 RESPOS</div>
      <div style="color:#88ddbb; font-size:13px; line-height:1.8;">
        🎯 FRAME: ${frame}<br>
        🔄 RESPOS: ${totalRespos % 9 + 1}/9<br>
        🔁 LOOP: ${loopCount}<br>
        ⚡ FPS: ${fps}<br>
        🧍 STATUS: ${totalRespos > 0 ? 'TANZEND' : 'STEHEND'}
      </div>
      <div style="color:#445555; font-size:10px; margin-top:12px; border-top:1px solid rgba(255,255,255,0.02); padding-top:12px;">
        9 RESPOS · 1/2 SEK · NONSTOP · FILM
      </div>
      <button onclick="this.parentElement.parentElement.remove()" style="
        margin-top:14px; background:rgba(20,35,35,0.2); color:#668888;
        border:1px solid rgba(255,255,255,0.02); padding:6px 20px;
        border-radius:18px; cursor:pointer; font-family:inherit; font-size:9px;
      ">⏎ SCHLIESSEN</button>
    </div>
  `;
  document.body.appendChild(proof);
}

// ===== RESET =====
function resetAll() {
  totalRespos = 0;
  frame = 0;
  loopCount = 0;
  fps = 0;
  frameCount = 0;
  document.getElementById('btnStart').classList.remove('active');
  document.getElementById('statusText').textContent = 'reset';
  updateUI();
}

// ===== CONTROLS =====
document.getElementById('btnStart').addEventListener('click', () => {
  running = true;
  document.getElementById('btnStart').classList.add('active');
  document.getElementById('statusText').textContent = 'läuft';
});

document.getElementById('btnRespo').addEventListener('click', triggerRespo);
document.getElementById('btnShuffle').addEventListener('click', shuffleRespos);
document.getElementById('btnProof').addEventListener('click', showProof);
document.getElementById('btnReset').addEventListener('click', resetAll);

// ===== TASTATUR =====
document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); document.getElementById('btnStart').click(); }
  if (e.key === 'r' || e.key === 'R') document.getElementById('btnRespo').click();
  if (e.key === 's' || e.key === 'S') document.getElementById('btnShuffle').click();
  if (e.key === 'p' || e.key === 'P') document.getElementById('btnProof').click();
  if (e.key === 'x' || e.key === 'X') document.getElementById('btnReset').click();
});

// ===== CANVAS RESIZE =====
function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const size = Math.min(rect.width, rect.height, 550);
  canvas.width = size;
  canvas.height = size;
}
window.addEventListener('resize', resizeCanvas);

// ===== INIT =====
resizeCanvas();
setTimeout(resizeCanvas, 200);
updateUI();
update();

console.log('🧍 STRICHMÄNNCHEN · 9 RESPOS · TANZ · FILM');
console.log('🎯 9 FRAMES · 1/2 SEK · NONSTOP');
console.log('⌨️  Leertaste=Start  r=RESPO  s=SHUFFLE  p=PROOF  x=Reset');
</script>

</body>
</html>
