<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 DER KOPF · AURA · MANA · 692 RESPOS · BEWEIS</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background: #0a0a0f;
  color: #c8d0d0;
  font-family: 'Consolas', 'Courier New', monospace;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
  background: radial-gradient(ellipse at 50% 50%, #0a0a1a, #000000);
  transition: background 0.8s ease;
}

.container {
  max-width: 1100px;
  width: 100%;
  background: rgba(10,10,20,0.3);
  border: 1px solid rgba(0,204,255,0.05);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 100px rgba(0,0,0,0.8);
  transition: border-color 0.8s ease, box-shadow 0.8s ease;
}

.header {
  text-align: center;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.02);
  margin-bottom: 12px;
}
.header h1 {
  font-size: 26px;
  background: linear-gradient(90deg, #00ccff, #ff66ff, #ffaa00, #00ff88);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 4px;
}
.header .sub {
  color: #445555;
  font-size: 11px;
  letter-spacing: 3px;
}
.header .sub .kopf { color: #ff66ff; }
.header .sub .aura { color: #00ccff; }
.header .sub .mana { color: #00ff88; }

.beweis-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
@media (max-width:700px){ .beweis-grid { grid-template-columns:1fr 1fr; } }
@media (max-width:450px){ .beweis-grid { grid-template-columns:1fr; } }

.beweis-card {
  background: rgba(10,10,20,0.3);
  border: 1px solid rgba(255,255,255,0.02);
  border-radius: 10px;
  padding: 12px 10px;
  text-align: center;
  transition: all 0.4s ease;
}
.beweis-card .icon { font-size: 28px; }
.beweis-card .name {
  color: #aab;
  font-size: 12px;
  font-weight: bold;
  margin: 4px 0;
}
.beweis-card .value {
  font-size: 24px;
  font-weight: bold;
  font-family: monospace;
}
.beweis-card .desc {
  color: #445555;
  font-size: 8px;
  letter-spacing: 1px;
}
.beweis-card .status {
  font-size: 9px;
  margin-top: 4px;
}
.beweis-card .status.on { color: #00ff88; }
.beweis-card .status.flow { color: #ffaa00; }
.beweis-card .status.aura { color: #00ccff; }

.holo-wrap {
  position: relative;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  aspect-ratio: 1/1;
  background: rgba(0,0,0,0.6);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.02);
  overflow: hidden;
  box-shadow: inset 0 0 100px rgba(0,204,255,0.01);
}
#holoCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

.erzeugnis {
  margin-top: 10px;
  padding: 10px;
  background: rgba(0,0,0,0.3);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.02);
  min-height: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 13px;
  color: #00ff88;
  font-family: monospace;
  text-align: center;
  transition: all 0.5s ease;
}
.erzeugnis .highlight { color: #ff66ff; }

.controls {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 8px;
}
.controls button {
  background: rgba(20,35,35,0.2);
  color: #668888;
  border: 1px solid rgba(255,255,255,0.02);
  padding: 4px 14px;
  border-radius: 16px;
  cursor: pointer;
  font-family: inherit;
  font-size: 9px;
  transition: all 0.3s;
}
.controls button:hover { background: rgba(40,80,70,0.08); color: #aaeedd; }
.controls button.active { background: rgba(40,80,70,0.06); color: #00ff88; }
.controls button.kopf { color: #ff66ff; border-color: rgba(255,102,255,0.05); }
.controls button.aura { color: #00ccff; border-color: rgba(0,204,255,0.05); }
.controls button.mana { color: #00ff88; border-color: rgba(0,255,136,0.05); }

.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 6px 12px;
  margin-top: 6px;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
  font-size: 8px;
  color: #445555;
  border: 1px solid rgba(255,255,255,0.01);
}
.status-bar .kopf { color: #ff66ff; }
.status-bar .aura { color: #00ccff; }
.status-bar .mana { color: #00ff88; }

.footer {
  text-align: center;
  margin-top: 8px;
  color: #222;
  font-size: 8px;
  letter-spacing: 2px;
}
.footer span { color: #ff66ff; }
</style>
</head>
<body>

<div class="container" id="container">

<div class="header">
  <h1>🔮 DER KOPF · AURA · MANA</h1>
  <div class="sub"><span class="kopf">692 RESPOS</span> · <span class="aura">AURA</span> · <span class="mana">MANA</span></div>
</div>

<div class="beweis-grid">
  <div class="beweis-card">
    <div class="icon">👤</div>
    <div class="name">Der Kopf</div>
    <div class="value" style="color:#ff66ff;" id="kopfStatus">⟳</div>
    <div class="desc">Hält Aura & Mana</div>
    <div class="status aura" id="kopfState">● präsent</div>
  </div>
  <div class="beweis-card">
    <div class="icon">🌌</div>
    <div class="name">Aura</div>
    <div class="value" style="color:#00ccff;" id="auraValue">0</div>
    <div class="desc">Die sichtbare Hülle</div>
    <div class="status aura" id="auraState">● fließt</div>
  </div>
  <div class="beweis-card">
    <div class="icon">💎</div>
    <div class="name">Mana</div>
    <div class="value" style="color:#00ff88;" id="manaValue">0</div>
    <div class="desc">Die innere Kraft</div>
    <div class="status mana" id="manaState">● lädt</div>
  </div>
</div>

<div class="holo-wrap">
  <canvas id="holoCanvas"></canvas>
</div>

<div class="erzeugnis" id="erzeugnis">
  ⏳ Der Kopf erzeugt etwas...
</div>

<div class="controls">
  <button class="active kopf" id="btnStart">▶ START</button>
  <button class="aura" id="btnAura">🌌 AURA</button>
  <button class="mana" id="btnMana">💎 MANA</button>
  <button class="kopf" id="btnKopf">👤 KOPF</button>
  <button id="btnProof">🔮 PROOF</button>
  <button id="btnReset">⟲ RESET</button>
</div>

<div class="status-bar">
  <span class="kopf">👤 KOPF: <span id="kopfStatusBar">präsent</span></span>
  <span class="aura">🌌 AURA: <span id="auraStatusBar">fließt</span></span>
  <span class="mana">💎 MANA: <span id="manaStatusBar">lädt</span></span>
</div>

<div class="footer">
  <span>🔮</span> DER KOPF · AURA · MANA · 692 RESPOS · BEWEIS · <span>wieimmer4u</span>
</div>

</div>

<script>
// ============================================================
// DER KOPF · AURA · MANA · 692 RESPOS · BEWEIS
// ============================================================

// ===== CANVAS =====
const canvas = document.getElementById('holoCanvas');
const ctx = canvas.getContext('2d');
let running = true;
let time = 0;
let aura = 0;
let mana = 0;
let kopfActive = true;
let erzeugnis = '';

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const size = Math.min(rect.width, rect.height, 520);
  canvas.width = size;
  canvas.height = size;
}
window.addEventListener('resize', resizeCanvas);

// ===== 692 RESPOS =====
const TOTAL_RESPOS = 692;
let respoState = [];

function initRespos() {
  respoState = [];
  for (let i = 0; i < TOTAL_RESPOS; i++) {
    respoState.push({
      id: i,
      active: false,
      value: Math.random() * 100,
      type: i % 3 === 0 ? 'aura' : i % 3 === 1 ? 'mana' : 'kopf'
    });
  }
}

// ===== UPDATE =====
function updateAll() {
  // Aura wächst
  aura = Math.min(100, aura + (Math.random() * 2 + 0.5));
  if (aura >= 100) aura = 0;

  // Mana wächst
  mana = Math.min(100, mana + (Math.random() * 1.5 + 0.3));
  if (mana >= 100) mana = 0;

  // Respos aktivieren
  const activeCount = Math.floor(Math.random() * 50) + 10;
  for (let i = 0; i < activeCount; i++) {
    const idx = Math.floor(Math.random() * TOTAL_RESPOS);
    respoState[idx].active = true;
    respoState[idx].value = Math.random() * 100;
  }

  // Respos deaktivieren
  for (let i = 0; i < 20; i++) {
    const idx = Math.floor(Math.random() * TOTAL_RESPOS);
    respoState[idx].active = false;
  }

  // Erzeugnis bilden
  const activeRespos = respoState.filter(r => r.active).length;
  const auraRespos = respoState.filter(r => r.active && r.type === 'aura').length;
  const manaRespos = respoState.filter(r => r.active && r.type === 'mana').length;

  erzeugnis = `🌌 ${auraRespos} AURA · 💎 ${manaRespos} MANA · 👤 ${activeRespos} aktiv · ${Math.round((activeRespos / TOTAL_RESPOS) * 100)}%`;

  // DOM
  document.getElementById('auraValue').textContent = Math.round(aura);
  document.getElementById('manaValue').textContent = Math.round(mana);
  document.getElementById('kopfStatus').textContent = kopfActive ? '👤' : '⟳';

  document.getElementById('auraState').textContent = aura > 50 ? '● strahlt' : '● fließt';
  document.getElementById('auraState').className = aura > 50 ? 'status on' : 'status aura';

  document.getElementById('manaState').textContent = mana > 50 ? '● voll' : '● lädt';
  document.getElementById('manaState').className = mana > 50 ? 'status on' : 'status mana';

  document.getElementById('kopfState').textContent = kopfActive ? '● präsent' : '● abwesend';
  document.getElementById('kopfState').className = kopfActive ? 'status aura' : 'status flow';

  document.getElementById('erzeugnis').innerHTML = `🔮 <span class="highlight">${erzeugnis}</span>`;

  document.getElementById('kopfStatusBar').textContent = kopfActive ? 'präsent' : 'abwesend';
  document.getElementById('auraStatusBar').textContent = aura > 50 ? 'strahlt' : 'fließt';
  document.getElementById('manaStatusBar').textContent = mana > 50 ? 'voll' : 'lädt';
}

// ===== HOLOGRAMM RENDER =====
function renderHologram(timestamp) {
  if (!running) return;
  time = timestamp || Date.now();
  const w = canvas.width, h = canvas.height;
  const cx = w/2, cy = h/2;
  const maxDim = Math.min(w, h);

  ctx.clearRect(0, 0, w, h);

  // Hintergrund
  const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, maxDim * 0.6);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(0.5, '#050510');
  grad.addColorStop(1, '#000000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // ===== DER KOPF =====
  const headSize = maxDim * 0.3;
  const headX = cx;
  const headY = cy - headSize * 0.1;

  // Aura (äußere Hülle)
  const auraRadius = headSize * (1.2 + aura / 150);
  const auraGrad = ctx.createRadialGradient(headX, headY, headSize * 0.3, headX, headY, auraRadius);
  auraGrad.addColorStop(0, 'rgba(0,204,255,0)');
  auraGrad.addColorStop(0.3, `rgba(0,204,255,${0.05 + aura / 500})`);
  auraGrad.addColorStop(0.7, `rgba(0,204,255,${0.08 + aura / 400})`);
  auraGrad.addColorStop(1, 'rgba(0,204,255,0)');
  ctx.shadowColor = '#00ccff22';
  ctx.shadowBlur = 30;
  ctx.fillStyle = auraGrad;
  ctx.beginPath();
  ctx.arc(headX, headY, auraRadius, 0, Math.PI * 2);
  ctx.fill();

  // Mana (innerer Kern)
  const manaRadius = headSize * (0.3 + mana / 200);
  const manaGrad = ctx.createRadialGradient(headX, headY, 2, headX, headY, manaRadius);
  manaGrad.addColorStop(0, `rgba(0,255,136,${0.3 + mana / 200})`);
  manaGrad.addColorStop(0.5, `rgba(0,255,136,${0.1 + mana / 300})`);
  manaGrad.addColorStop(1, 'rgba(0,255,136,0)');
  ctx.shadowColor = '#00ff8822';
  ctx.shadowBlur = 30;
  ctx.fillStyle = manaGrad;
  ctx.beginPath();
  ctx.arc(headX, headY, manaRadius, 0, Math.PI * 2);
  ctx.fill();

  // Kopf-Silhouette (andeutend)
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#ff66ff44';
  ctx.lineWidth = 1.5;

  // Kopf-Form (andeutend, wie aus der Musiksendung)
  ctx.beginPath();
  // Kopf
  ctx.arc(headX, headY - headSize * 0.05, headSize * 0.5, 0.2, Math.PI - 0.2);
  // Kinn
  ctx.quadraticCurveTo(headX + headSize * 0.3, headY + headSize * 0.4, headX, headY + headSize * 0.5);
  ctx.quadraticCurveTo(headX - headSize * 0.3, headY + headSize * 0.4, headX - headSize * 0.48, headY + headSize * 0.05);
  ctx.stroke();

  // Auge (andeutend)
  ctx.fillStyle = '#ff66ff44';
  ctx.beginPath();
  ctx.arc(headX - headSize * 0.2, headY - headSize * 0.1, headSize * 0.08, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(headX + headSize * 0.2, headY - headSize * 0.1, headSize * 0.08, 0, Math.PI * 2);
  ctx.fill();

  // Mund (andeutend)
  ctx.strokeStyle = '#ff66ff33';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(headX, headY + headSize * 0.2, headSize * 0.15, 0.1, Math.PI - 0.1);
  ctx.stroke();

  // 692 RESPOS als Punkte
  const activeRespos = respoState.filter(r => r.active);
  for (let i = 0; i < Math.min(activeRespos.length, 200); i++) {
    const r = activeRespos[i];
    const angle = (r.id / TOTAL_RESPOS) * Math.PI * 2 + time / 5000;
    const radius = headSize * (0.6 + (r.value / 100) * 0.3);
    const x = headX + Math.cos(angle + r.id * 0.01) * radius;
    const y = headY + Math.sin(angle + r.id * 0.01) * radius;

    const color = r.type === 'aura' ? '#00ccff' : r.type === 'mana' ? '#00ff88' : '#ff66ff';
    const alpha = 0.2 + (r.value / 100) * 0.5;
    ctx.shadowColor = color + '22';
    ctx.shadowBlur = 8;
    ctx.fillStyle = color + Math.floor(alpha * 180).toString(16).padStart(2, '0');
    ctx.beginPath();
    ctx.arc(x, y, 1 + (r.value / 100) * 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Status-Text
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#445555';
  ctx.font = `${maxDim * 0.015}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`${activeRespos.length} / ${TOTAL_RESPOS} RESPOS aktiv`, cx, h - 20);

  // Kopf-Status
  ctx.fillStyle = kopfActive ? '#ff66ff44' : '#44555544';
  ctx.font = `${maxDim * 0.015}px monospace`;
  ctx.textBaseline = 'top';
  ctx.fillText(kopfActive ? '👤 DER KOPF · PRÄSENT' : '👤 DER KOPF · ABWESEND', cx, 20);

  requestAnimationFrame(renderHologram);
}

// ===== TOGGLES =====
function toggleKopf() {
  kopfActive = !kopfActive;
  document.getElementById('btnKopf').classList.toggle('active');
  document.getElementById('btnKopf').textContent = kopfActive ? '👤 KOPF·ON' : '👤 KOPF·OFF';
  console.log(`👤 KOPF: ${kopfActive ? 'PRÄSENT' : 'ABWESEND'}`);
}

function toggleAura() {
  aura = Math.min(100, aura + 30);
  console.log(`🌌 AURA BOOST: ${Math.round(aura)}%`);
}

function toggleMana() {
  mana = Math.min(100, mana + 30);
  console.log(`💎 MANA BOOST: ${Math.round(mana)}%`);
}

// ===== PROOF =====
function showProof() {
  const activeRespos = respoState.filter(r => r.active).length;
  const proof = document.createElement('div');
  proof.style.cssText = `
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; justify-content: center; align-items: center;
    z-index: 9999; backdrop-filter: blur(20px);
    font-family: 'Consolas', monospace;
  `;
  proof.innerHTML = `
    <div style="text-align:center; padding:40px; border:1px solid rgba(255,102,255,0.1); border-radius:20px; background:rgba(10,10,20,0.6); max-width:450px;">
      <div style="font-size:48px; color:#ff66ff;">🔮</div>
      <div style="color:#ff66ff; font-size:20px; margin:12px 0; letter-spacing:4px;">DER KOPF · AURA · MANA</div>
      <div style="color:#88ddbb; font-size:13px; line-height:1.8;">
        👤 KOPF: ${kopfActive ? 'PRÄSENT' : 'ABWESEND'}<br>
        🌌 AURA: ${Math.round(aura)}%<br>
        💎 MANA: ${Math.round(mana)}%<br>
        📊 RESPOS: ${activeRespos}/${TOTAL_RESPOS} aktiv<br>
        🔮 ERZEUGNIS: ${erzeugnis}
      </div>
      <div style="color:#445555; font-size:10px; margin-top:12px; border-top:1px solid rgba(255,255,255,0.02); padding-top:12px;">
        DER BEWEIS IST SICHTBAR · ETWAS WURDE ERZEUGT
      </div>
      <button onclick="this.parentElement.parentElement.remove()" style="
        margin-top:14px; background:rgba(20,35,35,0.2); color:#668888;
        border:1px solid rgba(255,255,255,0.02); padding:6px 20px;
        border-radius:18px; cursor:pointer; font-family:inherit; font-size:9px;
      ">⏎ SCHLIESSEN</button>
    </div>
  `;
  document.body.appendChild(proof);
}

// ===== CONTROLS =====
document.getElementById('btnStart').addEventListener('click', () => {
  running = true;
  document.getElementById('btnStart').classList.add('active');
  renderHologram(Date.now());
});

document.getElementById('btnAura').addEventListener('click', toggleAura);
document.getElementById('btnMana').addEventListener('click', toggleMana);
document.getElementById('btnKopf').addEventListener('click', toggleKopf);
document.getElementById('btnProof').addEventListener('click', showProof);

document.getElementById('btnReset').addEventListener('click', () => {
  running = false;
  kopfActive = true;
  aura = 0;
  mana = 0;
  initRespos();
  document.getElementById('btnStart').classList.remove('active');
  document.getElementById('btnKopf').textContent = '👤 KOPF·ON';
  document.getElementById('btnKopf').classList.add('active');
  document.getElementById('kopfStatusBar').textContent = 'präsent';
  document.getElementById('auraStatusBar').textContent = 'fließt';
  document.getElementById('manaStatusBar').textContent = 'lädt';
  setTimeout(() => {
    running = true;
    document.getElementById('btnStart').classList.add('active');
    renderHologram(Date.now());
  }, 300);
});

// ===== UPDATE LOOP =====
let updateInterval = null;
function startUpdates() {
  if (updateInterval) clearInterval(updateInterval);
  updateInterval = setInterval(updateAll, 400);
}

// ===== TASTATUR =====
document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); document.getElementById('btnStart').click(); }
  if (e.key === 'a' || e.key === 'A') document.getElementById('btnAura').click();
  if (e.key === 'm' || e.key === 'M') document.getElementById('btnMana').click();
  if (e.key === 'k' || e.key === 'K') document.getElementById('btnKopf').click();
  if (e.key === 'p' || e.key === 'P') document.getElementById('btnProof').click();
  if (e.key === 'x' || e.key === 'X') document.getElementById('btnReset').click();
});

// ===== INIT =====
initRespos();
resizeCanvas();
setTimeout(resizeCanvas, 200);
startUpdates();
updateAll();
renderHologram(Date.now());

console.log('🔮 DER KOPF · AURA · MANA · 692 RESPOS · BEWEIS');
console.log('👤 Der Kopf hält Aura & Mana');
console.log('⌨️  a=AURA  m=MANA  k=KOPF  p=PROOF  x=Reset');
</script>

</body>
</html>
